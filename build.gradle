plugins {
    id 'groovy'
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id 'io.github.themrmilchmann.curseforge-publish' version "0.8.0"
    id "com.github.breadmoirai.github-release" version "2.3.7"
    // id 'checkstyle'
}

build {
    dependsOn ':ec-core:build'
}

ext.runTimestamp = new Date().format('yyyyMMddHHmmss')
ext.env = loadenv()

String getenv(String key) {
    return env.getOrDefault(key, "NOT FOUND")
}

tasks.named('remapJar').configure {
    dependsOn(tasks.named('compileTestGroovy'))
}

allprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'idea'


    group = project.maven_group
    String vers_suffix = getenv("VERSION_SUFFIX")
    String full_version = vers_suffix != 'NOT FOUND' && vers_suffix != ''
        ? "${project.mod_version}-mc${project.minecraft_version}+${vers_suffix}"
        : "${project.mod_version}-mc${project.minecraft_version}"
    println "version: $full_version"

    version = full_version
    base.archivesName = "${project.mod_id}"

    // Declare dependencies
    dependencies {
        // Fabric
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

        // Mods
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
//        modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
        modImplementation "me.lucko:fabric-permissions-api:${project.permissions_api_version}"

        // included in fabriclocader 1.15+, kept here for compat on older loaders, I think
        include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")))

        // Code Quality
        compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
        testImplementation platform("org.junit:junit-bom:${project.junit_bom_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"


        // JIJ Dependencies
        modApi  "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
        include "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
        modApi  "eu.pb4:placeholder-api:${project.placeholder_api_version}"
        include "eu.pb4:placeholder-api:${project.placeholder_api_version}"
        modImplementation 'org.yaml:snakeyaml:2.0'
        include 'org.yaml:snakeyaml:2.0'
        modImplementation "io.github.ladysnake:PlayerAbilityLib:${pal_version}"
        include "io.github.ladysnake:PlayerAbilityLib:${pal_version}"

        // mod compatibility
        modCompileOnly  "maven.modrinth:vanish:${project.vanish_version}"

        // Subprojects
        subprojects.each {
            implementation project(path: ":${it.name}", configuration: "namedElements")
            include project("${it.name}:") // nest within distribution
        }
    }

    // Perform tests using the JUnit test suite
    test {
        useJUnitPlatform()
    }

    // Produce a sources distribution
    java {
        withSourcesJar()
    }

    // Add the licence to all distributions
    tasks.withType(Jar).configureEach {
        it.from rootProject.file('LICENCE')
    }

    // Process any resources
    processResources {
        inputs.property 'id', project.mod_id
        inputs.property 'name', project.mod_name
        inputs.property 'version', project.version

        // fabric.mod.json
        filesMatching('fabric.mod.json') {
            expand(['id': project.mod_id, 'name': project.mod_name, 'version': project.version])
        }
    }

    // checkstyle {
    //     // use one common config file for all subprojects
    //     configFile = project(':').file('.checkstyle.xml')
    //     configProperties = [ "suppressionFile" : project(':').file('.checkstyle-suppressions.xml')]
    // }

    // Add any additional repositories
    repositories {
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
        maven { name 'Fabric'; url 'https://maven.fabricmc.net/' }
//        maven { name 'TerraformersMC'; url 'https://maven.terraformersmc.com/' }
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url 'https://maven.nucleoid.xyz' }
        // Used by FabricPlaceholderAPI

        maven {
            name = 'Ladysnake Mods'
            url = 'https://maven.ladysnake.org/releases'
            content {
                includeGroup 'io.github.ladysnake'
                includeGroupByRegex 'io\\.github\\.onyxstudios.*'
            }
        }
        maven { url "https://api.modrinth.com/maven" } // for vanish
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    // java version
    it.options.release.set(21)
}

//jar {
//    from("LICENSE") {
//        rename { "${it}_${project.archivesBaseName}"}
//    }
//}

// Define how packages are published
publishing {
    // Declare all publications
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.mod_id
            groupId = project.maven_group
            version = project.version
            // Main
            artifact(remapJar) { builtBy remapJar }
            // Sources
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }
    // Add repositories to publish to
    repositories {
        // GitHub Packages (https://pkg.github.com)
        mavenLocal {

        }
        maven {
            name 'GitHub'
            url "https://maven.pkg.github.com/${project.github_repo}"
            credentials {
                username = getenv('GITHUB_ACTOR')
                password = getenv('GITHUB_TOKEN')
            }
        }
    }
}


import com.github.breadmoirai.githubreleaseplugin.GithubReleaseTask
import com.modrinth.minotaur.TaskModrinthUpload
import com.modrinth.minotaur.request.VersionType
import io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat
import io.github.themrmilchmann.gradle.publish.curseforge.GameVersion
import io.github.themrmilchmann.gradle.publish.curseforge.ReleaseType

modrinth {
    token = getenv("MODRINTH")
    // An environment property called MODRINTH that is your token, set via Gradle CLI, GitHub Actions, Idea Run Configuration, or other
    projectId = project.modrinth_project_id
    versionNumber = (String) project.version // Will fail if Modrinth has this version already
    versionType = project.version.contains('alpha') ? VersionType.ALPHA.toString()
        : project.version.contains('beta') ? VersionType.BETA.toString()
        : VersionType.RELEASE.toString()

    // On fabric with loom, use 'remapJar' instead of 'jar'
    uploadFile = remapJar

    // This is the java jar task. If it can't find the jar, try 'jar.outputs.getFiles().asPath' in place of 'jar'
    gameVersions = List.of(project.mr_game_versions.split(','))
    changelog = readLatestChangelogSection()
    loaders = ['fabric']

    debugMode = false
    project.version
    dependencies {
        if (project.mr_relations_required?.trim()) project.mr_relations_required.split(',').each { required.project(it.trim()) }
        if (project.mr_relations_optional?.trim()) project.mr_relations_optional.split(',').each { optional.project(it.trim()) }
        if (project.mr_relations_embedded?.trim()) project.mr_relations_embedded.split(',').each { embedded.project(it.trim()) }
        if (project.mr_relations_incompatible?.trim()) project.mr_relations_incompatible.split(',').each { incompatible.project(it.trim()) }
    }
}


//type:
tasks.register("publishModrinth", TaskModrinthUpload) { // Make sure it runs after build!
    description 'Uploads all Modrinth projects'
    group 'upload'

    onlyIf {
        // Only attempt to run this task if the MODRINTH variable is set in .env, otherwise SKIP it
        env.containsKey("MODRINTH")
    }
}

curseforge {
    apiToken = getenv("CURSEFORGE")

    publications {
        register("main") {
            projectId = project.cf_project_id

            // Convert game versions from comma-separated string to GameVersion objects
            project.cf_game_versions.split(',').each { version ->
                gameVersions.add(new GameVersion("minecraft-java-edition", version.trim()))
            }

            artifacts.register("main") {
                displayName = "${project.version}"

                // Convert release type to enum
                releaseType = project.version.contains('alpha') ? ReleaseType.ALPHA
                    : project.version.contains('beta') ? ReleaseType.BETA
                    : ReleaseType.RELEASE

                // Set up changelog (pointing to GitHub releases instead of inline text)
                changelog {
                    format = ChangelogFormat.TEXT
                    content = "For a list of changes, please refer to https://github.com/${project.github_repo}/releases/tag/${project.version}"
                }

                from(remapJar)

                // Convert relations configuration
                relations {
                    if (project.cf_relations_required) {
                        project.cf_relations_required.split(',').each { dep ->
                            requiredDependency(dep.trim())
                        }
                    }
                    if (project.cf_relations_optional) {
                        project.cf_relations_optional.split(',').each { dep ->
                            optionalDependency(dep.trim())
                        }
                    }
                    if (project.cf_relations_embedded) {
                        project.cf_relations_embedded.split(',').each { dep ->
                            embeddedLibrary(dep.trim())
                        }
                    }
                    if (project.cf_relations_tools) {
                        project.cf_relations_tools.split(',').each { dep ->
                            tool(dep.trim())
                        }
                    }
                    if (project.cf_relations_incompatible) {
                        project.cf_relations_incompatible.split(',').each { dep ->
                            incompatible(dep.trim())
                        }
                    }
                }
            }

            // Add additional artifacts from subprojects
            subprojects.eachWithIndex { subproject, index ->
                artifacts.register("subproject${index}") {
                    from(subproject.remapJar)
                    displayName = "${subproject.name} - ${project.version}"
                    releaseType = project.version.contains('alpha') ? ReleaseType.ALPHA
                        : project.version.contains('beta') ? ReleaseType.BETA
                        : ReleaseType.RELEASE
                }
            }
        }
    }
}

tasks.register("publishCurseForge") {
    description 'Uploads to CurseForge'
    group 'upload'

    dependsOn 'publishMainPublicationToCurseForge'

    onlyIf {
        env.containsKey("CURSEFORGE")
    }
}

tasks.register("publishGithubRelease", GithubReleaseTask) {
    description 'Creates a GitHub Release for the project'
    group 'upload'

    onlyIf {
        env.containsKey("GITHUB")
    }
}
githubRelease {
    token = getenv("GITHUB") // This is your personal access token with Repo permissions
    // You get this from your user settings > developer settings > Personal Access Tokens
    owner = project.gh_owner // default is the last part of your group. Eg group: "com.github.breadmoirai" => owner: "breadmoirai"
    repo = project.gh_repo // by default this is set to your project name
    tagName = project.version as String // by default this is set to "v${project.version}"
    targetCommitish = "1.21.x" // by default this is set to "master"
    releaseName = project.version as String // Release title, by default this is the same as the tagName
    body = readLatestChangelogSection() // by default this is empty
    draft = false // by default this is false
    prerelease = false // by default this is false
    releaseAssets base.libsDirectory
        .getAsFileTree()
        .matching((PatternFilterable pattern) -> pattern.include("**/*${project.version}.jar"))
    //jar.outputs.getFiles().asPath//
    overwrite = false // by default false; if set to true, will delete an existing release with the same tag and name
    dryRun = false // by default false; you can use this to see what actions would be taken without making a release
    apiEndpoint = "https://api.github.com" // should only change for github enterprise users
    client // This is the okhttp client used for http requests
    allowUploadToExisting = false
}

generatePomFileForMavenJavaPublication {}

def static loadenv(String path = ".env") {
    def env = [:]

    def file = new File(path)
    if (file.exists()) {
        file.eachLine { line ->
            def (name, value) = line.tokenize("=")
            env[name.trim()] = value.trim()
        }
    }
    for (el in System.getenv()) {
        env[el.key] = el.value;
    }
    return env
}

String getTimestamp() {
    return ext.runTimestamp
}

ext.cachedChangelog = null

String readChangelogFromFile() {
    if (ext.has('cachedChangelog')) {
        return ext.cachedChangelog
    }

    String changelogFilePath = './changelog.md'
    var file = new File(changelogFilePath)
    if (!file.exists()) {
        logger.warn("'%s' not found.", changelogFilePath)
        ext.cachedChangelog = "changelog file not found"
        return ext.cachedChangelog
    }

    ext.cachedChangelog = file.getText('UTF-8')
    return ext.cachedChangelog
}

String readLatestChangelogSection() {
    String fullChangelog = readChangelogFromFile()

    if (fullChangelog == "changelog file not found") {
        return fullChangelog
    }

    String[] sections = fullChangelog.split('--- --- ---')
    String mostRecentSection = sections[0].trim()

    String suffix = """---

If you discover any bugs, you can report them in the [Issue Tracker](https://github.com/John-Paul-R/Essential-Commands/issues).

Additional conversation can be had in the [dev room discord](https://discord.jpcode.dev/essential-commands).
mr_relations_optional

"""

    return mostRecentSection + '\n\n' + suffix
}
