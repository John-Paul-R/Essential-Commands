
# This workflow publishes releases to GitHub Packages, Modrinth, CurseForge, and GitHub Releases

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      abort_on_tag_conflict:
        description: 'Abort if tag already exists'
        required: true
        type: boolean
        default: true
      publish_github_packages:
        description: 'Publish to GitHub Packages'
        required: true
        type: boolean
        default: true
      publish_modrinth:
        description: 'Publish to Modrinth'
        required: true
        type: boolean
        default: true
      publish_curseforge:
        description: 'Publish to CurseForge'
        required: true
        type: boolean
        default: true
      publish_github_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true

env:
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: publish

    permissions:
      contents: write
      packages: write

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v6

      - name: 📖 Extract version from gradle.properties
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MC_VERSION=$(grep '^minecraft_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          TAG="$MOD_VERSION-mc$MC_VERSION"
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted mod version: $MOD_VERSION"
          echo "Extracted minecraft version: $MC_VERSION"
          echo "Tag will be: $TAG"

      - name: 🏷️ Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists remotely
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            if [ "${{ inputs.abort_on_tag_conflict }}" = "true" ]; then
              echo "❌ Tag ${{ steps.version.outputs.tag }} already exists!"
              echo "Please update the mod_version in gradle.properties to create a new release."
              exit 1
            else
              echo "⚠️ Tag ${{ steps.version.outputs.tag }} already exists, skipping tag creation"
            fi
          else
            git tag ${{ steps.version.outputs.tag }}
            git push origin ${{ steps.version.outputs.tag }}
            echo "✅ Created and pushed tag: ${{ steps.version.outputs.tag }}"
          fi

      - name: 🛂 Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 🏗 Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 📷 Begin Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build artifacts and Run Tests
        env:
          IS_PIPELINE: true
        run: gradle clean build

      - name: 🎯 Prepare mod-only artifact dir
        run: |
          mkdir -p upload-staging
          find build/libs -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-test*.jar" \
            -exec cp {} upload-staging/ \;

      - name: 📦 Upload mod-only artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod_artifact
          path: upload-staging/
          # jars are already compressed
          compression-level: 0

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: 'build/libs/'
          # jars are already compressed
          compression-level: 0

      - name: 📝 Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'

      - name: 📤 Publish to GitHub Packages
        if: inputs.publish_github_packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PIPELINE: true
        run: gradle publishMavenJavaPublicationToGitHubRepository

      - name: 📤 Publish to Modrinth
        if: inputs.publish_modrinth
        env:
          MODRINTH: ${{ secrets.MODRINTH }}
          IS_PIPELINE: true
        run: gradle publishModrinth

      - name: 📤 Publish to CurseForge
        if: inputs.publish_curseforge
        env:
          CURSEFORGE: ${{ secrets.CURSEFORGE }}
          IS_PIPELINE: true
        run: gradle publishCurseforge

      - name: 📤 Create GitHub Release
        if: inputs.publish_github_release
        env:
          GITHUB: ${{ secrets.GITHUB_TOKEN }}
          IS_PIPELINE: true
        run: gradle publishGitHub

      - name: 🧨 Cleanup Gradle cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
